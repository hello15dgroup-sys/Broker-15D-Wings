name = "broker-15d-wings"
main = "src/edge/index.ts"
compatibility_date = "2024-03-20"

# Distributed Static Assets Directory
assets = { directory = "./dist" }

# R2 Buckets for Operator & Mission Documentation
[[r2_buckets]]
binding = "OPERATOR_DOCS"
bucket_name = "15dwings-operator-docs"

[[r2_buckets]]
binding = "MISSION_DOCS"
bucket_name = "15dwings-mission-docs"

# Active Durable Objects for Real-Time Broker Workstreams
[[durable_objects.bindings]]
name = "CHAT_DO"
class_name = "ChatDO"

[ai]
binding = "AI"

# Migrations (Purged legacy non-broker DO classes: ICC, Operators, Client portals)
[[migrations]]
tag = "v1"
new_sqlite_classes = []

[[migrations]]
tag = "v2"
new_sqlite_classes = []

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ChatDO"]
deleted_classes = [
  "MissionPortalDO",
  "OperatorPortalDO",
  "ICCPortalDO",
  "DocumentProcessorDO",
  "MissionClockDO",
  "PricingEngineDO"
]

