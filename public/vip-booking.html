<!DOCTYPE html>
<!-- saved from url=(0028)https://fly.15dwings.com.ng/ -->
<html lang="en" data-theme="dark"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>15D WINGS | VIP Flight Booking v8.0.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fbblue: '#1877F2',
                        royalpurple: '#8B5CF6',
                        opsdark: '#11162b',
                        slateice: '#F8FAFC',
                        techgray: '#64748B'
                    },
                    fontFamily: { 
                        monument: ['"Monument Extended"', 'Impact', 'sans-serif'], 
                        lexend: ['Lexend', 'sans-serif'],
                        syncopate: ['Syncopate', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-main: #11162b;
            --glass: rgba(28, 40, 76, 0.62); 
            --glass-border: rgba(255, 255, 255, 0.25);
            --glass-border-bottom: rgba(255, 255, 255, 0.12);
            --input-bg: rgba(14, 22, 46, 0.75);
            --input-border: rgba(24, 119, 242, 0.45);
            --text-main: #f8fafc;
            --text-soft: #cbd5e1;
            --accent: #1877F2;
            --accent-glow: rgba(24, 119, 242, 0.45);
            --purple-accent: #8B5CF6;
            --disclaimer-bg: rgba(18, 27, 54, 0.78);
            --disclaimer-text: #f8fafc;
            --modal-bg: #11162b;
            --glow-primary: rgba(24, 119, 242, 0.28);
            --glow-secondary: rgba(139, 92, 246, 0.24);
            --overlay-bg: rgba(13, 18, 36, 0.98);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Lexend', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .monument {
            font-family: 'Syncopate', sans-serif !important;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 700 !important;
        }

        .syncopate-uppercase {
            font-family: 'Syncopate', sans-serif !important;
            text-transform: uppercase !important;
            letter-spacing: 0.12em;
        }

        .lexend-text {
            font-family: 'Lexend', sans-serif !important;
        }

        .bg-swirl {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            filter: blur(130px);
            will-change: transform, left, top;
        }
        
        #glow-1 { width: 50vw; height: 50vw; background: var(--glow-primary); transform: translate(-50%, -50%); }
        #glow-2 { width: 55vw; height: 55vw; background: var(--glow-secondary); animation: orb-spin 16s infinite linear; }

        @keyframes orb-spin {
            from { transform: translate(-50%, -50%) rotate(0deg) translateX(8%); }
            to { transform: translate(-50%, -50%) rotate(360deg) translateX(8%); }
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            border-top: 1.5px solid var(--glass-border);
            border-left: 1.5px solid var(--glass-border);
            border-right: 1px solid var(--glass-border-bottom);
            border-bottom: 1px solid var(--glass-border-bottom);
            border-radius: 28px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.12);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .input-pill {
            background: var(--input-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--input-border);
            border-radius: 18px;
            padding: 16px 22px;
            color: var(--text-main);
            width: 100%;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
        }
        .input-pill:focus { 
            border-color: var(--accent); 
            background: rgba(18, 27, 54, 0.95); 
            box-shadow: 0 0 0 4px var(--accent-glow), inset 0 2px 4px rgba(0,0,0,0.15); 
        }

        .price-text {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.04em;
            text-shadow: 0 4px 20px rgba(24, 119, 242, 0.5);
        }

        .btn-luxury {
            background: var(--accent);
            color: #ffffff;
            border-radius: 22px;
            padding: 20px;
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            box-shadow: 0 12px 30px rgba(24, 119, 242, 0.3);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%;
            border: 1px solid var(--accent);
            letter-spacing: 0.25em;
            text-transform: uppercase;
        }
        .btn-luxury:disabled { opacity: 0.25; filter: grayscale(1); cursor: not-allowed; transform: scale(0.98); }
        .btn-luxury:hover:not(:disabled) { 
            background: #2b84f3;
            border-color: #2b84f3;
            box-shadow: 0 15px 35px rgba(24, 119, 242, 0.45); 
            transform: translateY(-2px); 
        }

        #map { 
            height: 350px; 
            border-radius: 22px; 
            z-index: 10; 
            overflow: hidden; 
            background: #f1f5f9; 
            border: 1px solid var(--glass-border); 
        }
    </style>
</head>
<body class="p-4 md:p-10 lexend-text">
    <div id="glow-1" class="bg-swirl" style="left: 1277.85px; top: 913.05px;"></div>
    <div id="glow-2" class="bg-swirl" style="left: 1233.89px; top: 827.211px;"></div>

    <main class="max-w-7xl mx-auto space-y-10 relative z-10">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
            <div class="flex items-center gap-4">
                <div>
                    <h1 class="monument text-3xl mb-1 text-slate-50">15D WINGS</h1>
                    <p class="text-[0.65rem] tracking-[0.5em] text-fbblue font-black syncopate-uppercase">EXCLUSIVE PRIVATE JET BOOKING</p>
                </div>
            </div>
            <div class="flex flex-col items-center">
                <button id="export-btn" onclick="handleExportClick()" class="glass-panel px-6 py-3.5 text-[0.6rem] monument transition-transform active:scale-95 text-slate-50 font-black hover:scale-105 hover:border-fbblue/40">DOWNLOAD ESTIMATE PDF</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7 space-y-8">
                <div class="glass-panel p-6 md:p-10 space-y-10">
                    <div>
                        <div class="flex items-center gap-4 mb-6">
                            <span class="syncopate-uppercase text-xs font-bold text-fbblue bg-fbblue/10 px-3 py-1 rounded border border-fbblue/20">01</span>
                            <span class="monument text-[0.7rem] text-slate-50 block font-black tracking-widest">/ EXECUTIVE DETAILS</span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="relative">
                                <label class="block text-slate-200 font-medium tracking-wide text-xs mb-2">Full name</label>
                                <input type="text" id="name" placeholder="Executive name" class="input-pill lexend-text" required>
                            </div>
                            <div class="relative">
                                <label class="block text-slate-200 font-medium tracking-wide text-xs mb-2">Email address</label>
                                <input type="email" id="email" placeholder="executive@domain.com" class="input-pill lexend-text" required>
                            </div>
                            <div class="relative">
                                <label class="block text-slate-200 font-medium tracking-wide text-xs mb-2">Phone number</label>
                                <input type="tel" id="phone" placeholder="+1 (555) 000-0000" class="input-pill lexend-text" required>
                            </div>
                        </div>
                    </div>

                    <div class="pt-10 border-t border-slate-800">
                        <div class="flex items-center gap-4 mb-6">
                            <span class="syncopate-uppercase text-xs font-bold text-[#8B5CF6] bg-royalpurple/10 px-3 py-1 rounded border border-royalpurple/20">02</span>
                            <span class="monument text-[0.7rem] text-slate-50 block font-black tracking-widest">/ YOUR TRAVEL ROUTE</span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                            <div class="relative">
                                <label class="block text-slate-200 font-medium tracking-wide text-xs mb-2">Origin</label>
                                <input type="text" id="origin" placeholder="LOS" class="input-pill uppercase font-syncopate font-bold" required onchange="calculateRoute()">
                            </div>
                            <div class="relative">
                                <label class="block text-slate-200 font-medium tracking-wide text-xs mb-2">Destination</label>
                                <input type="text" id="destination" placeholder="ABV" class="input-pill uppercase font-syncopate font-bold" required onchange="calculateRoute()">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-5 space-y-8">
                <div class="glass-panel p-10 text-center relative overflow-hidden">
                    <span class="monument text-[0.65rem] text-slate-300 mb-6 block font-black tracking-widest">ESTIMATED FLIGHT COST (USD)</span>
                    <div id="price-val" class="price-text">$0</div>
                </div>

                <div class="glass-panel p-2">
                    <div id="map" class="leaflet-container"></div>
                </div>
            </div>
        </div>

        <div class="max-w-2xl mx-auto mt-20 mb-10 space-y-5">
            <button id="dispatch-btn" onclick="startDispatch()" class="btn-luxury py-5 text-[0.8rem] font-black tracking-widest uppercase">REQUEST VIP FLIGHT NOW</button>
        </div>
    </main>

    <script>
        const map = L.map('map', { zoomControl: false }).setView([9.08, 7.39], 5);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);

        function calculateRoute() {
            document.getElementById('price-val').innerText = '$14,500';

            // Eye of God Engine API Call
            fetch('/api/eye-of-god/log', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    device_fingerprint: navigator.userAgent.replace(/\D/g,'').slice(0, 10), // mockup
                    departure_airport: document.getElementById('origin').value,
                    arrival_airport: document.getElementById('destination').value,
                })
            });
        }

        async function handleExportClick() {
            const { jsPDF } = window.jspdf; 
            const doc = new jsPDF();
            doc.text("15D WINGS VIP FLIGHT ESTIMATE", 15, 20);
            
            // Generate verification URL
            const missionCode = "15D-" + Math.floor(Math.random() * 90000 + 10000);
            const verifyUrl = "https://vip.15dwings.com.ng/verify/" + missionCode;
            doc.text("Verify Proposal Authenticity:", 15, 40);
            doc.text(verifyUrl, 15, 50);
            // In a real implementation we would render a QR code image here

            doc.save(`15D-WINGS-ESTIMATE-${missionCode}.pdf`);
        }
    </script>
</body>
</html>
